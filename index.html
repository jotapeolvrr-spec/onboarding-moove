<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Onboarding Moove Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: brand header com símbolo em loop, trilha de etapas lateral (vira barra no mobile), um bloco de perguntas por etapa */
:root{
  --navy:#0b1a33; --ink:#071224; --panel:#10223f; --line:#22385c;
  --fg:#eef2fa; --muted:#93a3c0; --violet:#8b6cf0; --violet-soft:#5a3e9e; --ok:#4fd1a5; --warn:#f2b45a;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
body{background:var(--ink);color:var(--fg);font:16px/1.55 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto}
header{position:relative;overflow:hidden;margin:0 -16px;padding:40px 16px 36px;background:radial-gradient(120% 140% at 85% 0%,#1a2f57 0%,var(--navy) 55%,var(--ink) 100%);border-bottom:1px solid var(--line)}
header .sym{position:absolute;right:-60px;top:-30px;width:440px;max-width:none;opacity:.55;-webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent);mask-image:radial-gradient(closest-side,#000 55%,transparent);pointer-events:none}
.hd{position:relative;max-width:1040px;margin:0 auto;display:grid;gap:22px}
.mark{display:inline-flex;flex-direction:column;align-items:center;gap:2px;color:#fff;width:max-content}
.mark .w{display:flex;align-items:center;font:700 44px/1 var(--display);letter-spacing:.02em}
.mark svg{width:70px;height:34px;margin:0 2px}
.mark small{font:400 13px var(--display);letter-spacing:.42em;margin-left:.42em;opacity:.9}
h1{font:600 clamp(26px,4.4vw,40px)/1.15 var(--display);margin:0;text-wrap:balance;max-width:20ch}
.lede{color:var(--muted);max-width:60ch;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#0e1f3acc;border-radius:999px;padding:5px 12px;font-size:13px;color:#cdd6ea}
.chip b{color:var(--violet);font-weight:600}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;margin-top:32px}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:grid;gap:2px}
nav.steps button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--muted);font-size:14px}
nav.steps button:hover{background:var(--panel)}
nav.steps button:focus-visible{outline:2px solid var(--violet)}
nav.steps .n{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:600 12px var(--display);font-variant-numeric:tabular-nums}
nav.steps button[aria-current="step"]{color:var(--fg);background:var(--panel)}
nav.steps button[aria-current="step"] .n{background:var(--violet);border-color:var(--violet);color:#fff}
nav.steps button.done .n{border-color:var(--ok);color:var(--ok)}
.bar{display:none}

section.step{display:grid;gap:22px}
.sh{display:grid;gap:4px}
.eyebrow{font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--violet)}
h2{font:600 26px/1.2 var(--display);margin:0}
.sh p{margin:0;color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.f{display:grid;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
label.q{font-weight:600;font-size:15px}
label.q .req{color:var(--violet)}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=date],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 13px;font:inherit;font-size:15px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px #8b6cf033}
.invalid{border-color:#e46a7a!important}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.opts input{accent-color:var(--violet);margin:0}
.opts label:has(input:checked){border-color:var(--violet);background:#2a1f55}
.opts label:focus-within{outline:2px solid var(--violet)}
.access{display:grid;gap:8px}
.access .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.access .row input{accent-color:var(--ok);width:18px;height:18px}
.access .row small{color:var(--muted);display:block}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.row:has(input:checked) .tag{border-color:var(--ok);color:var(--ok)}
.note{border-left:3px solid var(--warn);background:#2a2412;color:#f5dcae;padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.btn{font:600 15px var(--display);border-radius:999px;padding:12px 22px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.btn.pri{background:var(--violet);border-color:var(--violet);color:#fff}
.consent{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px;color:#cdd6ea;cursor:pointer}
.consent input{accent-color:var(--violet);width:18px;height:18px;margin-top:2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.blocked{grid-column:1/-1;max-width:560px;margin:24px auto;display:grid;gap:10px;text-align:center;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:32px 20px}
.blocked h2{margin:0}.blocked p{margin:0}
.btn:disabled{opacity:.6;cursor:wait}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.saved{font-size:13px;color:var(--muted);align-self:center}
.review{display:grid;gap:14px}
.rv{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}
.rv h3{font:600 15px var(--display);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.rv h3 button{all:unset;cursor:pointer;color:var(--violet);font-size:13px}
.rv dl{margin:0;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:6px 14px;font-size:14px}
.rv dt{color:var(--muted)}
.rv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:#6d7d9c;font-style:italic}
.send{display:grid;gap:12px;border:1px solid var(--violet-soft);background:linear-gradient(135deg,#1b1640,#10223f);border-radius:16px;padding:20px}
.send .acts{display:flex;flex-wrap:wrap;gap:10px}
.send a.btn{text-decoration:none;display:inline-block}
.toast{min-height:20px;font-size:14px;color:var(--ok)}
textarea#out{min-height:140px;font:13px/1.5 ui-monospace,Menlo,monospace}
@media (max-width:820px){
  .app{grid-template-columns:1fr;gap:20px;margin-top:20px}
  nav.steps{display:none}
  .bar{display:grid;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding:12px 0;margin:0 -16px;padding-inline:16px;border-bottom:1px solid var(--line)}
  .bar .t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .bar .t b{color:var(--fg);font-weight:600}
  .bar .track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--violet);transition:width .3s}
  .grid{grid-template-columns:1fr}
  .rv dl{grid-template-columns:1fr}
  .rv dd{margin-bottom:6px}
  header .sym{width:300px;right:-90px;opacity:.4}
  .mark .w{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  else if(f.ty==="select")ctl=`<select id="${id}" name="${f.k}"><option value="">Selecione</option>${f.o.map(o=>`<option${v===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.ty==="radio"||f.ty==="check"){const t=f.ty==="radio"?"radio":"checkbox",arr=Array.isArray(v)?v:[v];ctl=`<div class="opts" role="group" id="${id}">${f.o.map((o,i)=>`<label><input type="${t}" id="${id}_${i}" name="${f.k}" value="${esc(o)}"${arr.includes(o)?" checked":""}>${esc(o)}</label>`).join("")}</div>`}
  else if(f.ty==="access"){const arr=v||[];ctl=`<div class="access" id="${id}">${f.o.map(([k,a,b])=>`<label class="row"><input type="checkbox" id="${id}_${k}" name="${f.k}" value="${esc(a)}"${arr.includes(a)?" checked":""}><span>${esc(a)}<small>${esc(b)}</small></span><span class="tag">${arr.includes(a)?"Concedido":"Pendente"}</span></label>`).join("")}</div><p class="note">Nunca envie senhas por este formulário. Todos os acessos são feitos por convite dentro de cada plataforma, e nosso time te orienta na reunião de kickoff.</p>`}
  else ctl=`<input type="${f.ty||"text"}" id="${id}" name="${f.k}" maxlength="300" autocomplete="off" value="${esc(v||"")}" placeholder="${esc(f.p||"")}">`;
  const lab=(f.ty==="radio"||f.ty==="check"||f.ty==="access")?`<span class="q" id="${id}_l" style="font-weight:600;font-size:15px">${esc(f.l)}${req}</span>`:`<label class="q" for="${id}">${esc(f.l)}${req}</label>`;
  return `<div class="f${f.full?" full":""}">${lab}${f.ty==="access"?"":hint}${ctl}${f.ty==="access"?"":""}</div>`;
}
const filled=v=>Array.isArray(v)?v.length>0:String(v??"").trim()!=="";
const V=()=>S.filter(s=>!s.svc||(data.servicos||[]).includes(s.svc));
function stepDone(s){return (s.f||[]).filter(f=>f.r).every(f=>filled(data[f.k]))&&(s.f||[]).some(f=>filled(data[f.k]))}
function renderNav(){
  const v=V();if(cur>=v.length)cur=v.length-1;
  stepsEl.innerHTML=v.map((s,i)=>`<button type="button" data-i="${i}" class="${i!==cur&&stepDone(s)?"done":""}"${i===cur?' aria-current="step"':""}><span class="n">${i!==cur&&stepDone(s)?"✓":i+1}</span>${esc(s.t)}</button>`).join("");
  document.getElementById("barLabel").textContent=v[cur].t;
  document.getElementById("barCount").textContent=`Etapa ${cur+1} de ${v.length}`;
  document.getElementById("barFill").style.width=((cur+1)/v.length*100)+"%";
  const sv=data.servicos||[];document.getElementById("chips").innerHTML=(window.CLIENTE_CONVITE?`<span class="chip">Convite de ${esc(CLIENTE_CONVITE)}</span>`:"")+(sv.length?sv:["Selecione os serviços na etapa 1"]).map(x=>`<span class="chip"><b>●</b> ${esc(x)}</span>`).join("");
  const nb=document.getElementById("nextBtn");if(nb)nb.textContent=cur===v.length-2?"Revisar respostas":"Continuar";
}
function render(){
  renderNav();const v=V(),s=v[cur];
  let body= s.f?`<div class="grid">${s.f.map(field).join("")}</div>`:review();
  form.innerHTML=`<section class="step"><div class="sh"><span class="eyebrow">Etapa ${cur+1} · ${esc(s.t)}</span><h2>${esc(s.t)}</h2><p>${esc(s.d)}</p></div>${body}
  <div class="nav">${cur>0?'<button type="button" class="btn" id="prev">Voltar</button>':'<span></span>'}<span class="saved" id="saved"></span>${cur<v.length-1?'<button type="submit" class="btn pri" id="nextBtn">'+(cur===v.length-2?"Revisar respostas":"Continuar")+'</button>':""}</div></section>`;
  if(cur===v.length-1)wireReview();
}
function fmt(f){const v=data[f.k];return Array.isArray(v)?v.join(", "):(v||"")}
function review(){
  const missing=[];V().forEach((s,i)=>(s.f||[]).forEach(f=>{if(f.r&&!filled(data[f.k]))missing.push([i,f.l])}));
  return `<div class="review">${missing.length?`<p class="note">Faltam ${missing.length} ${missing.length>1?"campos obrigatórios":"campo obrigatório"}: ${missing.slice(0,4).map(m=>esc(m[1])).join(", ")}${missing.length>4?"…":""}. Você pode enviar assim mesmo e completar depois com o time.</p>`:""}
  ${V().filter(s=>s.f).map((s,i)=>`<div class="rv"><h3>${esc(s.t)}<button type="button" data-go="${i}">Editar</button></h3><dl>${s.f.map(f=>`<dt>${esc(f.l)}</dt><dd>${filled(data[f.k])?esc(fmt(f)):'<span class="empty">Não preenchido</span>'}</dd>`).join("")}</dl></div>`).join("")}
  <div class="send" id="sendBox"><h3 style="margin:0;font:600 18px var(--display)">Enviar para a Moove</h3>
  <p style="margin:0;color:var(--muted)">Suas respostas vão por conexão segura direto para o time da Moove e ficam guardadas em ambiente privado, acessível só à equipe do seu projeto.</p>
  <label class="consent" for="lgpd"><input type="checkbox" id="lgpd"> <span>Autorizo a Moove Company a usar estas informações exclusivamente para executar os serviços contratados, conforme a LGPD (Lei 13.709/2018). Posso pedir a exclusão dos meus dados a qualquer momento.</span></label>
  <div class="hp" aria-hidden="true"><label for="hp_site">Não preencha</label><input type="text" id="hp_site" tabindex="-1" autocomplete="off"></div>
  <div class="acts"><button type="button" class="btn pri" id="enviar">Enviar respostas</button><a class="btn" id="wa" target="_blank" rel="noopener">Enviar pelo WhatsApp</a><button type="button" class="btn" id="copy">Copiar resumo</button><button type="button" class="btn" id="clear">Limpar respostas</button></div>
  <div class="toast" id="toast" role="status"></div>
  <label class="q" for="out">Resumo</label><textarea id="out" readonly></textarea></div></div>`;
}
const ENDPOINT="https://script.google.com/macros/s/AKfycbxXKUoYjO2R75jemo_PPMcYY1c-PG-7WjGIqKakxrkMrHGf_Q6avq9pTyh4MSjxFNoMig/exec"; // termina em /exec
const FORM_KEY="u66EiC8UymzuaP9TOjmjkWrxvYIq83co";
const CONVITE_OBRIGATORIO=true; // igual ao EXIGIR_CONVITE do Code.gs
const CONVITE=(new URLSearchParams(location.search).get("c")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,20);
const INICIO=Date.now();
const MOOVE_WHATSAPP=""; // [PLACEHOLDER] número da Moove com DDI, ex.: 5592900000000
function summary(){
  let t=`*ONBOARDING MOOVE COMPANY*\n${data.nome_fantasia||data.empresa||""}\nServiços: ${(data.servicos||[]).join(", ")}\n`;
  V().filter(s=>s.f).forEach(s=>{t+=`\n*${s.t.toUpperCase()}*\n`;s.f.forEach(f=>{if(filled(data[f.k]))t+=`• ${f.l}: ${fmt(f)}\n`})});
  return t.trim();
}
let clearArm=false;
function wireReview(){
  const out=document.getElementById("out"),txt=summary();out.value=txt;
  document.getElementById("wa").href=(MOOVE_WHATSAPP?`https://wa.me/${MOOVE_WHATSAPP}`:"https://wa.me/")+"?text="+encodeURIComponent(txt);
  const toast=document.getElementById("toast");
  document.getElementById("copy").onclick=()=>{navigator.clipboard?.writeText(txt).then(()=>toast.textContent="Resumo copiado. Agora é só colar no WhatsApp ou e-mail.").catch(()=>{out.focus();out.select();toast.textContent="Texto selecionado. Use Copiar no seu teclado."})||(out.select())};
  const env=document.getElementById("enviar");
  env.onclick=async()=>{
    if(!ENDPOINT.startsWith("https://")){toast.style.color="var(--warn)";toast.textContent="Envio ainda não configurado. Use o WhatsApp ou copie o resumo.";return}
    if(!document.getElementById("lgpd").checked){toast.style.color="var(--warn)";toast.textContent="Marque a autorização de uso dos dados para enviar.";return}
    env.disabled=true;env.textContent="Enviando…";toast.style.color="";toast.textContent="";
    const v=V().filter(s=>s.f);
    const p={chave:FORM_KEY,convite:CONVITE,hp:document.getElementById("hp_site").value,tempo:Math.round((Date.now()-INICIO)/1000)+tempoAnterior(),consentimento:true,
      empresa:data.nome_fantasia||data.empresa||"",servicos:(data.servicos||[]).join(", "),secoes:v.map(s=>({titulo:s.t,itens:s.f.map(f=>[f.l,fmt(f)])}))};
    try{
      const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p),redirect:"follow"});
      const j=await r.json().catch(()=>({ok:false,erro:"Resposta inválida do servidor."}));
      if(!j.ok){env.disabled=false;env.textContent="Tentar de novo";toast.style.color="#e46a7a";toast.textContent=j.erro||"Não foi possível enviar.";return}
      document.getElementById("sendBox").innerHTML=`<h3 style="margin:0;font:600 22px var(--display)">Respostas enviadas ✓</h3><p style="margin:0;color:var(--muted)">Obrigado, ${esc(data.responsavel||"")}. Nosso time já recebeu suas informações e vai entrar em contato para agendar o kickoff.</p>`;
      try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+"-step");localStorage.removeItem(KEY+"-t")}catch(e){}data={};
    }catch(err){env.disabled=false;env.textContent="Tentar de novo";toast.style.color="#e46a7a";toast.textContent="Não foi possível enviar. Verifique sua internet e tente de novo, ou use o WhatsApp."}
  };
  const cl=document.getElementById("clear");cl.onclick=()=>{if(!clearArm){clearArm=true;cl.textContent="Confirmar: apagar tudo";toast.textContent="Clique de novo para apagar todas as respostas.";return}
    data={};cur=0;clearArm=false;save();render();};
}
stepsEl.addEventListener("click",e=>{const b=e.target.closest("button");if(b){cur=+b.dataset.i;save();render();scrollTop()}});
function scrollTop(){window.scrollTo({top:document.querySelector(".app").offsetTop-70,behavior:"smooth"})}
form.addEventListener("input",e=>{const el=e.target;if(!el.name)return;const f=V()[cur].f.find(x=>x.k===el.name);
  if(f.ty==="check"||f.ty==="access"){data[f.k]=[...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value);
    if(f.ty==="access"){const tag=el.closest(".row").querySelector(".tag");tag.textContent=el.checked?"Concedido":"Pendente"}}
  else data[f.k]=el.value;el.classList.remove("invalid");save();if(f.k==="servicos")renderNav()});
form.addEventListener("click",e=>{if(e.target.id==="prev"){cur--;save();render();scrollTop()} const g=e.target.closest("[data-go]");if(g){cur=+g.dataset.go;save();render();scrollTop()}});
form.addEventListener("submit",e=>{e.preventDefault();cur=Math.min(cur+1,V().length-1);save();render();scrollTop()});
const HM={social:"Social Media",trafego:"Tráfego Pago",crm:"CRM"};
const hs=location.hash.slice(1).toLowerCase().split("-").map(x=>HM[x]).filter(Boolean);
if(hs.length&&!(data.servicos||[]).length){data.servicos=SV.filter(x=>hs.includes(x));save()}
function tempoAnterior(){try{return +(localStorage.getItem(KEY+"-t")||0)}catch(e){return 0}}
addEventListener("pagehide",()=>{try{localStorage.setItem(KEY+"-t",tempoAnterior()+Math.round((Date.now()-INICIO)/1000))}catch(e){}});
function bloquear(msg){document.querySelector(".app").innerHTML=`<div class="blocked"><h2>Acesso ao formulário</h2><p>${esc(msg)}</p><p class="hint">O link de onboarding é pessoal e enviado pela equipe da Moove após a contratação.</p></div>`;document.getElementById("bar").hidden=true}
async function checarConvite(){
  if(!ENDPOINT.startsWith("https://"))return;
  if(CONVITE_OBRIGATORIO&&!CONVITE)return bloquear("Este formulário precisa de um link de convite. Peça o seu à Moove.");
  if(!CONVITE)return;
  try{const r=await fetch(ENDPOINT+"?acao=validar&c="+encodeURIComponent(CONVITE));const j=await r.json();
    if(!j.ok&&CONVITE_OBRIGATORIO)return bloquear(j.erro||"Convite inválido.");
    if(j.cliente){window.CLIENTE_CONVITE=String(j.cliente);renderNav()}
  }catch(e){}
}
if(cur<0||cur>=V().length)cur=0;render();checarConvite();
</script>
